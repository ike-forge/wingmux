[package]
name = "wingmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "0BSD"
description = "Tmux-native control centre for supervising coding agents across repositories and worktrees"
repository = "https://github.com/ike-forge/wingmux"
homepage = "https://github.com/ike-forge/wingmux"

[[bin]]
name = "wingmux"
path = "src/bin/wingmux.rs"

# Short alias; cargo-dist ships every bin, so brew installs both.
[[bin]]
name = "wing"
path = "src/bin/wing.rs"

[package.metadata.dist]
dist = true

[dependencies]
ansi-to-tui = { version = "8.0.1", default-features = false, features = ["zero-copy"] }
log = { version = "0.4.33", features = ["std"] }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"

# cargo-dist builds release artifacts with this profile.
[profile.dist]
inherits = "release"
lto = "thin"
