# Wingmux — driven by mise (the single task runner, per the global
# task-runner rules). `mise install` is the complete setup step: it makes
# sure the declared toolchain exists. `mise tasks` lists what can be run.

[tools]
# rustfmt and clippy are not in mise's default minimal profile.
rust = { version = "1.97", components = "rustfmt,clippy" }
# Generates release.yml; `dist-workspace.toml` pins the same version.
"aqua:axodotdev/cargo-dist" = "0.33.1"

[tasks.build]
description = "Build the debug binary"
run = "cargo build"

[tasks.fmt]
description = "Check formatting (no changes)"
run = "cargo fmt --check"

[tasks.lint]
description = "Clippy with warnings as errors"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run the full test suite (tmux integration tests need tmux)"
run = "cargo test"

[tasks.gate]
description = "Everything before a commit: fmt + clippy + tests"
run = "cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test"

[tasks.install]
description = "Build the release binary and link it into ~/.local/bin as `wingmux-local`, alongside the brew binary"
run = "cargo build --release && mkdir -p ~/.local/bin && ln -sf $PWD/target/release/wingmux ~/.local/bin/wingmux-local"

[tasks.reset-config]
description = "Delete the local config dir (config.toml + theme copies) so the next run writes fresh defaults; leaves state.json alone"
run = """
dir="${XDG_CONFIG_HOME:-$HOME/.config}/wingmux"
if [ -d "$dir" ]; then
  find "$dir" -maxdepth 2 -type f -print
  rm -rf "$dir"
  echo "removed $dir — the next wingmux run writes the defaults and the shipped themes back"
else
  echo "nothing to do: $dir does not exist"
fi
"""

[tasks.ci]
description = "Everything CI gates on"
depends = ["gate"]
