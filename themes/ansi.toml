# LazyWingman theme — ansi (terminal palette only)
#
# Uses nothing but the terminal's ANSI-16 colours, so the UI inherits
# whatever palette your terminal emulator applies (including custom
# colour schemes). "default" leaves the terminal's own colours untouched.
name = "ansi"

[colors]
background = "default"
foreground = "default"
dim = "bright_black"
accent = "cyan"
selection_bg = "blue"
selection_fg = "white"
border = "bright_black"
border_focused = "cyan"
tree_repository = "cyan"
tree_worktree = "green"
tree_shell = "yellow"
status_waiting = "yellow"
status_failed = "red"
title_bg = "cyan"
title_fg = "black"
popup_bg = "black"
popup_fg = "white"
popup_border = "cyan"
