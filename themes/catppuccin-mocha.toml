# LazyWingman theme — catppuccin-mocha (dark, highest contrast — the
# usual default of the Catppuccin reference set)
#
# Official Catppuccin hex values, unmodified (theming guideline: never
# hand-tune a Catppuccin colour). Roles map to the palette: base →
# background, text/subtext0 → foreground/dim, surface0-2 → selection /
# borders, and the flavour accents for the semantic roles. Peach is the
# accent (key letters): on a dark flavour lavender lands ΔE ~20 from text,
# so a one-character key washes into the word beside it. Lavender keeps
# the focused border, where a whole edge carries the colour.
name = "catppuccin-mocha"

[colors]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim = "#a6adc8"
accent = "#fab387"
shortcut = "#f9e2af"
selection_bg = "#313244"
selection_fg = "#cdd6f4"
border = "#45475a"
border_focused = "#b4befe"
tree_repository = "#89b4fa"
tree_worktree = "#a6e3a1"
tree_shell = "#f9e2af"
status_waiting = "#f9e2af"
status_blocked = "#fab387"
status_failed = "#f38ba8"
status_ended = "#cba6f7"
title_bg = "#45475a"
title_fg = "#cdd6f4"
popup_bg = "#181825"
popup_fg = "#cdd6f4"
popup_border = "#b4befe"