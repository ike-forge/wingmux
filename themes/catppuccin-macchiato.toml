# LazyWingman theme — catppuccin-macchiato (dark, middle contrast)
#
# Official Catppuccin hex values, unmodified (theming guideline: never
# hand-tune a Catppuccin colour). Roles map to the palette: base →
# background, text/subtext0 → foreground/dim, surface0-2 → selection /
# borders, and the flavour accents for the semantic roles, with lavender
# reserved as the accent (key letters, focused borders).
name = "catppuccin-macchiato"

[colors]
background = "#24273a"
foreground = "#cad3f5"
dim = "#a5adcb"
accent = "#b7bdf8"
selection_bg = "#363a4f"
selection_fg = "#cad3f5"
border = "#494d64"
border_focused = "#b7bdf8"
tree_repository = "#8aadf4"
tree_worktree = "#a6da95"
tree_shell = "#eed49f"
status_working = "#a6da95"
status_waiting = "#eed49f"
status_blocked = "#f5a97f"
status_idle = "#6e738d"
status_failed = "#ed8796"
status_dead = "#8087a2"
status_ended = "#c6a0f6"
title_bg = "#494d64"
title_fg = "#cad3f5"
popup_bg = "#1e2030"
popup_fg = "#cad3f5"
popup_border = "#b7bdf8"