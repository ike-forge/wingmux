# LazyWingman theme — catppuccin-frappe (dark, warm, lowest contrast of the
# dark flavours)
#
# Official Catppuccin hex values, unmodified (theming guideline: never
# hand-tune a Catppuccin colour). Roles map to the palette: base →
# background, text/subtext0 → foreground/dim, surface0-2 → selection /
# borders, and the flavour accents for the semantic roles, with lavender
# reserved as the accent (key letters, focused borders).
name = "catppuccin-frappe"

[colors]
background = "#303446"
foreground = "#c6d0f5"
dim = "#a5adce"
accent = "#babbf1"
selection_bg = "#414559"
selection_fg = "#c6d0f5"
border = "#51576d"
border_focused = "#babbf1"
tree_repository = "#8caaee"
tree_worktree = "#a6d189"
tree_shell = "#e5c890"
status_waiting = "#e5c890"
status_failed = "#e78284"
title_bg = "#51576d"
title_fg = "#c6d0f5"
popup_bg = "#292c3c"
popup_fg = "#c6d0f5"
popup_border = "#babbf1"